<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Medibrief AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 360px;
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.1);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    color: white;
    animation: fadeIn 1s ease;
}

input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #00c6ff;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0072ff;
    transform: scale(1.05);
}

.hidden {
    display: none;
}

h2 {
    text-align: center;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="container" id="loginBox">
    <h2>Login</h2>
    <input type="text" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p onclick="showRegister()" style="text-align:center;cursor:pointer;">Register</p>
</div>

<div class="container hidden" id="registerBox">
    <h2>Register</h2>
    <input type="text" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Password">
    <button onclick="register()">Register</button>
    <p onclick="showLogin()" style="text-align:center;cursor:pointer;">Back</p>
</div>

<div class="container hidden" id="uploadBox">
    <h2>Upload Report</h2>
    <input type="file" id="fileInput">
    <button onclick="uploadFile()">Upload</button>
    <p id="result"></p>
</div>

<script>
let token = "";

// UI switch
function showRegister() {
    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("registerBox").classList.remove("hidden");
}

function showLogin() {
    document.getElementById("registerBox").classList.add("hidden");
    document.getElementById("loginBox").classList.remove("hidden");
}

// Register
async function register() {
    await fetch("http://127.0.0.1:8000/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: document.getElementById("regEmail").value,
            password: document.getElementById("regPassword").value
        })
    });

    alert("Registered! Now login.");
    showLogin();
}

// Login
async function login() {
    let formData = new URLSearchParams();
    formData.append("username", document.getElementById("email").value);
    formData.append("password", document.getElementById("password").value);

    let res = await fetch("http://127.0.0.1:8000/auth/jwt/login", {
        method: "POST",
        body: formData
    });

    let data = await res.json();
    token = data.access_token;

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("uploadBox").classList.remove("hidden");
}

// Upload
async function uploadFile() {
    let file = document.getElementById("fileInput").files[0];

    let formData = new FormData();
    formData.append("file", file);

    let res = await fetch("http://127.0.0.1:8000/files/upload", {
        method: "POST",
        headers: {
            "Authorization": "Bearer " + token
        },
        body: formData
    });

    let data = await res.json();
    document.getElementById("result").innerText =
        "Uploaded! Report ID: " + data.report_id;
}
</script>

</body>
</html>
