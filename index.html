<!DOCTYPE html>
<html>
<head>
    <title>Medibrief Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            width: 800px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            overflow-y: auto;
            max-height: 90vh;
        }

        h2 {
            margin-top: 20px;
            color: #2a5298;
        }

        input, button {
            padding: 10px;
            margin: 5px 0;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #2a5298;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1e3c72;
        }

        .section {
            margin-bottom: 20px;
        }

        #output {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 10px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">

    <h1 style="text-align:center;">Medibrief Dashboard</h1>

    <div class="section">
        <h2>Register</h2>
        <input id="reg_email" placeholder="Email">
        <input id="reg_password" type="password" placeholder="Password">
        <button onclick="register()">Register</button>
    </div>

    <div class="section">
        <h2>Login</h2>
        <input id="login_email" placeholder="Email">
        <input id="login_password" type="password" placeholder="Password">
        <button onclick="login()">Login</button>
    </div>

    <div class="section">
        <h2>Upload File</h2>
        <input type="file" id="fileInput">
        <button onclick="uploadFile()">Upload</button>
    </div>

    <div class="section">
        <h2>Get Reports</h2>
        <input id="report_id" placeholder="Optional report id">
        <button onclick="getReports()">Fetch Reports</button>
    </div>

    <h2>Response</h2>
    <div id="output"></div>

</div>

<script>

let token = "";

function showOutput(data, isError=false) {
    const output = document.getElementById("output");
    output.innerText = JSON.stringify(data, null, 2);
    output.className = isError ? "error" : "success";
}

async function register() {
    const response = await fetch("http://127.0.0.1:8000/auth/register", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            email: document.getElementById("reg_email").value,
            password: document.getElementById("reg_password").value
        })
    });

    const data = await response.json();
    showOutput(data, !response.ok);
}

async function login() {
    const formData = new URLSearchParams();
    formData.append("username", document.getElementById("login_email").value);
    formData.append("password", document.getElementById("login_password").value);

    const response = await fetch("http://127.0.0.1:8000/auth/jwt/login", {
        method: "POST",
        body: formData
    });

    const data = await response.json();
    if (response.ok) {
        token = data.access_token;
    }
    showOutput(data, !response.ok);
}

async function uploadFile() {
    const file = document.getElementById("fileInput").files[0];
    const formData = new FormData();
    formData.append("file", file);

    const response = await fetch("http://127.0.0.1:8000/files/upload", {
        method: "POST",
        headers: {"Authorization": `Bearer ${token}`},
        body: formData
    });

    const data = await response.json();
    showOutput(data, !response.ok);
}

async function getReports() {
    const id = document.getElementById("report_id").value;
    let url = "http://127.0.0.1:8000/reports";
    if (id) {
        url += `?report_id=${id}`;
    }

    const response = await fetch(url, {
        headers: {"Authorization": `Bearer ${token}`}
    });

    const data = await response.json();
    showOutput(data, !response.ok);
}

</script>

</body>
</html>
